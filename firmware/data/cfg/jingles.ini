; jingles.ini - the named note sequences a routine can find and play.
;
; One section per jingle, with its three keys:
;
;   [<identifier>]
;   full_title=<display name>
;   short_title=<short label>
;   notes=<note:ms pairs>
;
; The identifier is the stable key the device's selected jingle names, in settings.ini's [device]
; jingle= key, and the one device.set_jingle() stores. The display name is what a routine can show;
; the short label is what fits on the panel. The sequence is device.play_sequence() notation:
; note:ms pairs separated by spaces, and r for a rest.
;
; A line starting with ; is a comment, so a # in a sequence stays a sharp. An entry missing one of
; the three keys, or holding a sequence the player refuses, is reported at boot and left out.

