# Pin the board so `arduino-cli compile firmware/gardener` needs no FQBN.
#
# The S3 needs both options spelled out. USBMode=hwcdc routes USB to the chip's
# USB-Serial-JTAG CDC, which is the peripheral on GPIO19/20 that both the ROM downloader
# and the sketch share, so `(bool)Serial` is a real host-presence signal and esptool
# uploads keep working over the same cable. CDCOnBoot=cdc is not optional: it maps Serial
# to that CDC. Without it Serial is UART0 on GPIO43/44 and the interface never reaches the
# USB-C socket.
#
# FlashSize and PartitionScheme are pinned as well: the LittleFS partition the firmware mounts
# is the one `scripts/arduino.py --task data` writes, and its offset comes from this table.
#
# Library versions are pinned by `scripts/arduino.py --task libs`, which installs NimBLE-Arduino
# 2.5.1 for the Bluetooth transport; the sketch build itself takes the project local libraries. A
# build made with `--no-enable-bluetooth` leaves that stack out of the image.
default_fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default
