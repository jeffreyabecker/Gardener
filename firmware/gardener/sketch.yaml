# The board a build compiles for, which every profile pins, and the profile a build compiles when
# none is asked for. scripts/arduino.py reads the selected profile's fqbn to ask for the partition
# table the page image is written with, so a build and its image describe the same flash.
#
# The S3 needs both options spelled out. USBMode=hwcdc routes USB to the chip's
# USB-Serial-JTAG CDC, which is the peripheral on GPIO19/20 that both the ROM downloader
# and the sketch share, so `(bool)Serial` is a real host-presence signal and esptool
# uploads keep working over the same cable. CDCOnBoot=cdc is not optional: it maps Serial
# to that CDC. Without it Serial is UART0 on GPIO43/44 and the interface never reaches the
# USB-C socket.
#
# FlashSize and PartitionScheme pin the layout a build and its image are made for, rather than
# leaving it to whatever the board manager was set to: the platform's 4 MB default table, whose
# spiffs row is the partition `--task data` writes the page image to.
default_profile: s3-wifi

# The profiles the wrapper compiles. Each pins the board, the platform and the tree's own library by
# path, for the same reason: the build is the tree's choice rather than whatever the machine's
# library manager was left holding. A profile build excludes the globally installed libraries, so
# everything it needs is named here.
#
# Each records the build's options under `defines:`, one `NAME: value` per line, where a name is a
# knob's token without its `GARDENER_` prefix: the pins the sketch wires its parts to, then the
# numbers a different pump or valve changes. arduino-cli has no such field and ignores the block,
# and its own `profile create` and `profile lib` commands rewrite this file without it, so the block
# is kept by hand, and a board built with both links records its options in both.
#
# `s3-wifi` is the default: the ESP32-S3 with the serial and web device, and no library the tree
# does not hold. `s3-wifi-ble` is the same firmware plus the Bluetooth stack, the one library the
# tree does not hold, and the link compiles to a stub in the default build because BleLink.h looks
# for the stack's headers rather than a define.
profiles:
  s3-wifi-ble:
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default
    defines:
      PIN_SENSOR_ADC: 10
      PIN_PUMP: 8
      PIN_VENT_VALVE: 9
    platforms:
      - platform: esp32:esp32 (3.0.3)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: ../../libraries/Gardener
      - NimBLE-Arduino (2.5.1)
  s3-wifi:
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default
    defines:
      PIN_SENSOR_ADC: 10
      PIN_PUMP: 8
      PIN_VENT_VALVE: 9
    platforms:
      - platform: esp32:esp32 (3.0.3)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: ../../libraries/Gardener
