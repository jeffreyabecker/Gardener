# Pin the board so `arduino-cli compile firmware/gardener` needs no FQBN.
#
# The S3 needs both options spelled out. USBMode=hwcdc routes USB to the chip's
# USB-Serial-JTAG CDC, which is the peripheral on GPIO19/20 that both the ROM downloader
# and the sketch share, so `(bool)Serial` is a real host-presence signal and esptool
# uploads keep working over the same cable. CDCOnBoot=cdc is not optional: it maps Serial
# to that CDC. Without it Serial is UART0 on GPIO43/44 and the interface never reaches the
# USB-C socket.
#
# FlashSize and PartitionScheme are pinned so a build does not depend on whatever the
# board manager was left set to; nothing in the firmware mounts a filesystem now.
default_fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default

# The profile the wrapper compiles. It pins the platform, the tree's own library by path and the one
# library the tree does not hold — the Bluetooth stack — for the same reason the FQBN is pinned
# above: the build is the tree's choice rather than whatever the machine's library manager was left
# holding. A profile build excludes the globally installed libraries, so everything it needs is
# named here.
profiles:
  ble:
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default
    platforms:
      - platform: esp32:esp32 (3.0.3)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: ../../libraries/Gardener
      - NimBLE-Arduino (2.5.1)
