# Pin the board so `arduino-cli compile firmware/test_pressure` needs no FQBN.
#
# The Super Mini has no USB-to-UART bridge, so both options are required: USBMode=hwcdc routes USB
# to the chip's USB-Serial-JTAG CDC, and CDCOnBoot=cdc maps Serial to it. Without the second,
# Serial is UART0 on GPIO43/44 and the reports never reach the USB-C socket.
#
# The sketch compiles the firmware's own sensor driver, and `build_opt.h` beside it puts the two
# library source roots on the include path to reach it: a sketch cannot name a header inside a
# library's folders, and naming the library instead makes arduino-cli build every source it has,
# which here is the whole firmware. Those paths are relative, so the compile runs from the
# repository root - `arduino-cli compile firmware/test_pressure` - as every other build here does.
default_fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default
