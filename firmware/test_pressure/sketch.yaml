# Pin the board so `arduino-cli compile --libraries libraries firmware/test_pressure` needs no FQBN.
#
# The Super Mini has no USB-to-UART bridge, so both options are required: USBMode=hwcdc routes USB
# to the chip's USB-Serial-JTAG CDC, and CDCOnBoot=cdc maps Serial to it. Without the second,
# Serial is UART0 on GPIO43/44 and the reports never reach the USB-C socket.
#
# The sketch includes the firmware's libraries - Gardener.h, Gfx.h and Runtime.h - so it is built
# against them rather than copies of them, with the project's library folder named on the command
# line as the firmware's own build names it. Naming each library's own header is what puts that
# library's sources in the build; the driver's header inside one, hal/impl/XgzpSensor.h, is then
# reachable by its path. What that costs is the firmware's whole build: this sketch compiles
# everything the device compiles, so it is the slow way to check one part.
default_fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default

# The same board again as a profile, which is what carries the library list the command line would
# otherwise have to name: each `dir:` is one of the firmware's libraries, taken from the repository
# itself. With this as the default profile, `arduino-cli compile firmware/test_pressure` needs
# neither `--fqbn` nor `--libraries libraries`. The platform is pinned to the core the bench has
# installed, so it is the line to bump when the core moves.
profiles:
  bench:
    fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default
    platforms:
      - platform: esp32:esp32 (3.0.3)
    libraries:
      - dir: ../../libraries/Gardener
      - dir: ../../libraries/Gfx
      - dir: ../../libraries/Runtime
      - dir: ../../libraries/berry
default_profile: bench
