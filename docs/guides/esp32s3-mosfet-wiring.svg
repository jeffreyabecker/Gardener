  <text x="86" y="765" font-size="10.5" fill="#333333">JST receptacle, board side</text>
  <text x="52" y="787" font-size="10.5" fill="#333333">TO-220: 1 G · 2 D · 3 S, tab is D</text>

  <g font-size="11" fill="#555555">
    <text x="320" y="658">Each load plugs into its own 2-pin JST receptacle: pin 1 is +5 V and pin 2 the switched low side. The pump and the valve arrive</text>
    <text x="320" y="680">with matching plugs on a short pigtail; use a different pitch for each — PH for the pump, XH for the valve — so the two cables</text>
    <text x="320" y="702">cannot be swapped. Check the pigtail with a meter before the first run: the wire colours on these parts are not a specification,</text>
    <text x="320" y="724">and a reversed pump blows instead of sucking. The coil does not care which way round it is.</text>
    <text x="320" y="748">One 1N5819 across each load, cathode to 5 V, and on the board side of the connector so the connector never sees the spike.</text>
    <text x="320" y="770">Both loads switch low side: with the FET off the coil is de-energised, so a reset, a brownout or a cut wire still vents the chamber.</text>
    <text x="320" y="792">Gate: 100 Ω series and 10 k to ground at each FET — the pulldown holds both off while the GPIOs still float at boot.</text>
    <text x="320" y="814">The pump is a 3.7 V winding on 5 V, 35 % over its rail; the valve's 180 mA at 3.3 V is about 270 mA at 5 V. The 1000 µF absorbs</text>
    <text x="320" y="836">both surges. The FET tab is pin 2, so both tabs and both − terminals sit at 5 V while the FET is off: keep them off the</text>
    <text x="320" y="858">chassis. The 3.3 V buck is gone: the sensor, panel and keys stay on the MCU's 3V3 pin, and one star ground joins USB −, the</text>
    <text x="320" y="874">cap, both FET sources, the MCU and the sensor — with the sensor's return kept off the pump's.</text>
  </g>
</svg>
