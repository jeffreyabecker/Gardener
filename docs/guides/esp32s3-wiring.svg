<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="-7" y1="8" x2="7" y2="8" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="-4" y1="12" x2="4" y2="12" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="-1.5" y1="16" x2="1.5" y2="16" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1080" height="760" fill="#ffffff"/>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#1a1a1a">ESP32-S3 · XGZP6847A · DRV8833 · pump + vent valve</text>
  <text x="40" y="58" font-size="13" fill="#555555">ESP32-S3 Super Mini header pins 1–38 · DRV8833 16-pin TSSOP (PW) IC pin numbers</text>

  <g font-size="11">
    <rect x="850" y="36" width="200" height="126" rx="8" fill="#fbfbfb" stroke="#cccccc"/>
    <text x="862" y="58" font-weight="700" fill="#1a1a1a">Legend</text>
    <line x1="862" y1="72" x2="890" y2="72" stroke="#c0392b" stroke-width="2"/>
    <text x="896" y="76" fill="#333333">5 V (USB)</text>
    <line x1="862" y1="90" x2="890" y2="90" stroke="#d35400" stroke-width="2"/>
    <text x="896" y="94" fill="#333333">3.3 V</text>
    <line x1="862" y1="108" x2="890" y2="108" stroke="#2471a3" stroke-width="2"/>
    <text x="896" y="112" fill="#333333">signal</text>
    <line x1="862" y1="126" x2="890" y2="126" stroke="#8e44ad" stroke-width="2"/>
    <text x="896" y="130" fill="#333333">motor rail (VM)</text>
    <use href="#gnd" x="876" y="138"/>
    <text x="896" y="150" fill="#333333">GND — star ground</text>
  </g>

  <rect x="40" y="150" width="210" height="340" rx="10" fill="#f4f6f8" stroke="#343a40" stroke-width="1.5"/>
  <text x="145" y="182" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">ESP32-S3</text>
  <text x="145" y="200" font-size="12" fill="#555555" text-anchor="middle">Super Mini</text>

  <circle cx="260" cy="200" r="3.5" fill="#1a1a1a"/>
  <text x="252" y="204" font-size="12" text-anchor="end" fill="#1a1a1a">3V3 · pin 3</text>
  <circle cx="260" cy="260" r="3.5" fill="#1a1a1a"/>
  <text x="252" y="264" font-size="12" text-anchor="end" fill="#1a1a1a">GPIO7 · pin 12</text>
  <circle cx="260" cy="320" r="3.5" fill="#1a1a1a"/>
  <text x="252" y="324" font-size="12" text-anchor="end" fill="#1a1a1a">GPIO6 · pin 11</text>
  <circle cx="260" cy="380" r="3.5" fill="#1a1a1a"/>
  <text x="252" y="384" font-size="12" text-anchor="end" fill="#1a1a1a">GPIO5 · pin 10</text>
  <circle cx="260" cy="440" r="3.5" fill="#1a1a1a"/>
  <text x="252" y="444" font-size="12" text-anchor="end" fill="#1a1a1a">GND · pin 2</text>
  <circle cx="40" cy="200" r="3.5" fill="#1a1a1a"/>
  <text x="72" y="204" font-size="12" text-anchor="start" fill="#1a1a1a">5V · pin 1</text>

  <circle cx="30" cy="70" r="4" fill="#c0392b"/>
  <text x="38" y="74" font-size="12" font-weight="700" fill="#c0392b">USB-C 5 V (data cable)</text>
  <line x1="30" y1="70" x2="30" y2="630" stroke="#c0392b" stroke-width="2"/>
  <line x1="30" y1="200" x2="40" y2="200" stroke="#c0392b" stroke-width="2"/>
  <line x1="30" y1="630" x2="40" y2="630" stroke="#c0392b" stroke-width="2"/>

  <line x1="260" y1="200" x2="300" y2="200" stroke="#d35400" stroke-width="2"/>
  <rect x="300" y="191" width="40" height="18" rx="4" fill="#fdebd0" stroke="#d35400" stroke-width="1.2"/>
  <text x="320" y="204" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">3V3</text>

  <line x1="260" y1="440" x2="290" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <use href="#gnd" x="290" y="440"/>

  <rect x="460" y="70" width="230" height="190" rx="10" fill="#f4f6f8" stroke="#343a40" stroke-width="1.5"/>
  <text x="575" y="100" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">XGZP6847A</text>
  <text x="575" y="118" font-size="12" fill="#555555" text-anchor="middle">pressure sensor (6-DIP)</text>

  <circle cx="460" cy="130" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="134" font-size="12" fill="#1a1a1a">VDD — pin 2, 4</text>
  <circle cx="460" cy="170" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="174" font-size="12" fill="#1a1a1a">GND — pin 3, 6</text>
  <circle cx="460" cy="210" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="214" font-size="12" fill="#1a1a1a">OUT — pin 5</text>
  <circle cx="460" cy="245" r="3.5" fill="#888888"/>
  <text x="472" y="249" font-size="12" fill="#888888">N/C — pin 1</text>

  <line x1="460" y1="130" x2="425" y2="130" stroke="#d35400" stroke-width="2"/>
  <rect x="385" y="121" width="40" height="18" rx="4" fill="#fdebd0" stroke="#d35400" stroke-width="1.2"/>
  <text x="405" y="134" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">3V3</text>

  <line x1="460" y1="170" x2="425" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <use href="#gnd" x="425" y="170"/>

  <line x1="460" y1="245" x2="435" y2="245" stroke="#888888" stroke-width="1.5"/>
  <text x="430" y="249" font-size="11" fill="#888888" text-anchor="end">N/C</text>

  <path d="M 260 260 L 400 260 L 400 210 L 460 210" fill="none" stroke="#2471a3" stroke-width="2"/>

  <path d="M 445 210 L 445 265" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="452" y="246" font-size="11" fill="#555555">10k</text>
  <use href="#gnd" x="445" y="265"/>

  <text x="460" y="300" font-size="11" fill="#555555">100 nF across VDD–GND at the part · 10k OUT→GND keeps an unplugged sensor at 0 V</text>

  <rect x="460" y="360" width="310" height="330" rx="10" fill="#f4f6f8" stroke="#343a40" stroke-width="1.5"/>
  <text x="615" y="392" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">DRV8833</text>
  <text x="615" y="410" font-size="12" fill="#555555" text-anchor="middle">dual H-bridge module</text>

  <circle cx="460" cy="410" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="414" font-size="12" fill="#1a1a1a">AIN1 — pin 16</text>
  <circle cx="460" cy="450" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="454" font-size="12" fill="#1a1a1a">AIN2 — pin 15</text>
  <circle cx="460" cy="500" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="504" font-size="12" fill="#1a1a1a">BIN1 — pin 9</text>
  <circle cx="460" cy="540" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="544" font-size="12" fill="#1a1a1a">BIN2 — pin 10</text>
  <circle cx="460" cy="580" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="584" font-size="12" fill="#1a1a1a">nSLEEP — pin 1</text>
  <circle cx="460" cy="620" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="624" font-size="12" fill="#1a1a1a">VM — pin 12</text>
  <circle cx="460" cy="655" r="3.5" fill="#1a1a1a"/>
  <text x="472" y="659" font-size="12" fill="#1a1a1a">GND — pin 13</text>

  <circle cx="770" cy="430" r="3.5" fill="#1a1a1a"/>
  <text x="762" y="434" font-size="12" fill="#1a1a1a" text-anchor="end">AOUT1 — pin 2</text>
  <circle cx="770" cy="465" r="3.5" fill="#1a1a1a"/>
  <text x="762" y="469" font-size="12" fill="#1a1a1a" text-anchor="end">AOUT2 — pin 4</text>
  <circle cx="770" cy="590" r="3.5" fill="#1a1a1a"/>
  <text x="762" y="594" font-size="12" fill="#1a1a1a" text-anchor="end">BOUT1 — pin 7</text>
  <circle cx="770" cy="625" r="3.5" fill="#1a1a1a"/>
  <text x="762" y="629" font-size="12" fill="#1a1a1a" text-anchor="end">BOUT2 — pin 5</text>

  <line x1="460" y1="450" x2="425" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <use href="#gnd" x="425" y="450"/>
  <line x1="460" y1="540" x2="425" y2="540" stroke="#1a1a1a" stroke-width="1.5"/>
  <use href="#gnd" x="425" y="540"/>
  <line x1="460" y1="655" x2="425" y2="655" stroke="#1a1a1a" stroke-width="1.5"/>
  <use href="#gnd" x="425" y="655"/>

  <line x1="460" y1="580" x2="425" y2="580" stroke="#d35400" stroke-width="2"/>
  <rect x="385" y="571" width="40" height="18" rx="4" fill="#fdebd0" stroke="#d35400" stroke-width="1.2"/>
  <text x="405" y="584" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">3V3</text>

  <path d="M 260 320 L 460 410" fill="none" stroke="#2471a3" stroke-width="2"/>
  <path d="M 260 380 L 460 500" fill="none" stroke="#2471a3" stroke-width="2"/>

  <path d="M 250 630 L 250 620 L 460 620" fill="none" stroke="#8e44ad" stroke-width="2"/>

  <rect x="40" y="590" width="210" height="80" rx="10" fill="#f4f6f8" stroke="#343a40" stroke-width="1.5"/>
  <text x="145" y="626" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">3.3 V buck</text>
  <text x="145" y="648" font-size="11" fill="#555555" text-anchor="middle">in: USB 5 V · out: VM</text>
  <circle cx="40" cy="630" r="3.5" fill="#1a1a1a"/>
  <circle cx="250" cy="630" r="3.5" fill="#1a1a1a"/>

  <rect x="840" y="360" width="170" height="140" rx="10" fill="#f4f6f8" stroke="#343a40" stroke-width="1.5"/>
  <text x="925" y="388" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">JQB2438</text>
  <text x="925" y="406" font-size="12" fill="#555555" text-anchor="middle">pump (motor)</text>
  <circle cx="840" cy="430" r="3.5" fill="#1a1a1a"/>
  <text x="852" y="434" font-size="12" fill="#1a1a1a">term 1</text>
  <circle cx="840" cy="465" r="3.5" fill="#1a1a1a"/>
  <text x="852" y="469" font-size="12" fill="#1a1a1a">term 2</text>

  <rect x="840" y="520" width="170" height="140" rx="10" fill="#f4f6f8" stroke="#343a40" stroke-width="1.5"/>
  <text x="925" y="548" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">solenoid valve</text>
  <text x="925" y="566" font-size="12" fill="#555555" text-anchor="middle">normally open</text>
  <circle cx="840" cy="590" r="3.5" fill="#1a1a1a"/>
  <text x="852" y="594" font-size="12" fill="#1a1a1a">term 1</text>
  <circle cx="840" cy="625" r="3.5" fill="#1a1a1a"/>
  <text x="852" y="629" font-size="12" fill="#1a1a1a">term 2</text>

  <path d="M 770 430 L 840 430" fill="none" stroke="#2471a3" stroke-width="2"/>
  <path d="M 770 465 L 840 465" fill="none" stroke="#2471a3" stroke-width="2"/>
  <path d="M 770 590 L 840 590" fill="none" stroke="#2471a3" stroke-width="2"/>
  <path d="M 770 625 L 840 625" fill="none" stroke="#2471a3" stroke-width="2"/>

  <text x="460" y="712" font-size="11" fill="#555555">1000 µF across VM–GND at the driver · VINT (pin 14) and VCP (pin 11) are handled on the module</text>
  <text x="460" y="732" font-size="11" fill="#555555">Switch mode: AIN2 (15) and BIN2 (10) tied low · AIN1 (16) = pump PWM · BIN1 (9) = valve · nSLEEP (1) high</text>
  <text x="840" y="688" font-size="11" fill="#555555">de-energised vents (fail-safe)</text>
  <text x="40" y="748" font-size="11" fill="#555555">One star ground: USB GND, buck GND, driver GND, MCU GND and sensor GND all meet at one point — the sensor's return must not share wire with the pump's return.</text>
</svg>
