sentence=The host side of the Berry interpreter: the install and the native modules a page is written against, and the scene a page is drawn by.
paragraph=What a Gardener build gives the vendored interpreter: install(), which gives a fresh VM the vacuum, screen and device modules and the native Config class, the four modules themselves, the page scene whose hooks are a page's own methods, and the draw tree that scene walks. It compiles against the vendored Berry for the VM and against Gfx for the canvas a page draws on, and also against libraries/Gardener for the machine's bounds and run state, the two documents and the buzzer — a depends on Gardener would close the cycle with the depends that names this library, so that one is stated here rather than declared.
