sentence=Serial controllable vacuum pump firmware for the ESP32-S3, with the panel it draws on.
paragraph=The whole device's behaviour: XGZP analog pressure sensing, PWM pump drive with a vent valve, the control law and the serial and Bluetooth interfaces, and — when the build has a panel — the display, keys, buzzer, gauge, page stack and interpreter over the machine, with the interpreter's host side: the native modules a page is written against, the page scene and the draw tree. The parts are named as interfaces; the board that fills them, the file store and the tasks are the Runtime library's, and the sketch's PanelRoot owns the arrangement.
