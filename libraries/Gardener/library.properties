sentence=Serial controllable vacuum pump firmware for the ESP32-S3.
paragraph=The whole device's behaviour: XGZP analog pressure sensing, PWM pump drive with a vent valve, the closed loop that holds a pressure, and the serial interface a controller drives it through. The parts are named as interfaces; the board that fills them and the tasks that drive them are the Runtime library's, and the sketch composes the two.
