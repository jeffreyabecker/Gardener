sentence=Serial controllable vacuum pump firmware for the ESP32-C3 and ESP32-S3.
paragraph=The whole device's behaviour: XGZP analog pressure sensing, PWM pump drive with a vent valve, the closed loop that holds a pressure, and the serial interface a controller drives it through. The parts are named as interfaces in core and the rig's drivers that fill them sit in core/hal; the composition that builds the parts and the tasks that drive them sit beside the sketch, which composes the two.
