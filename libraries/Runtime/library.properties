sentence=The tasks a Gardener build runs: the control beat, the interface, the panel and their queue.
paragraph=The separation of a Gardener composition into FreeRTOS tasks — the control task that steps the tick, the interface task that polls the two links, the panel task that drives a routine and the glass, and the queue a caller posts machine commands into. It drives Gardener and is not part of it: a build includes Gardener.h and Runtime.h, and Gardener names no task.
