sentence=The board a Gardener build runs on: its parts, its file store, its link and the tasks that drive them.
paragraph=The platform side of a Gardener composition — the builder that turns the board's pins into the pump, sensor and valve, the queue a caller posts machine commands into, and the control and interface tasks that drive the machine and poll the serial link. It drives Gardener and is not part of it: a build includes Gardener.h and Runtime.h, and nothing in Gardener names a task.
