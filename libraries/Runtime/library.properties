sentence=The board a Gardener build runs on: its parts, its file store, its links and the tasks that drive them.
paragraph=The platform side of a Gardener composition — the pump, sensor, valve, gauge, keys, piezo and display drivers, the file store the documents are read from, the Bluetooth transport, the two composition roots, the control task that steps the tick, the interface task that polls the two links, the panel task that drives the glass and the queue a caller posts machine commands into. It drives Gardener and is not part of it: a build includes Gardener.h and Runtime.h, Gardener names no pin, bus, file store or vendor header, and nothing in Gardener names a task.
